<!DOCTYPE html>
<html data-bs-theme="dark" lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Gráfica EPA — Cadastro no Sistema</title>
    <!-- Bootstrap 5.3 CSS CDN -->
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" rel="stylesheet"/>
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <style>
        :root {
            --bs-primary: #0d6efd;
            --bs-body-bg: #0b0e14;
            --bs-card-bg: #151922;
            --bs-border-color: #232936;
        }

        body {
            background-color: var(--bs-body-bg);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
        }

        .auth-card {
            background-color: var(--bs-card-bg);
            border: 1px solid var(--bs-border-color);
            border-radius: 1rem;
            max-width: 560px;
            width: 100%;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }

        .brand-logo-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, #0d6efd, #084298);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #ffffff;
            margin: 0 auto 1rem auto;
            box-shadow: 0 8px 16px rgba(13, 110, 253, 0.3);
        }
    </style>
</head>
<body class="bg-body">
<!-- Container Principal Centralizado -->
<main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="card auth-card p-4 p-sm-5" style="border: 1px solid rgba(13, 110, 253, 0.6); box-shadow: rgba(13, 110, 253, 0.45) 0px 0px 15px, rgba(13, 110, 253, 0.2) 0px 0px 30px, rgba(13, 110, 253, 0.15) 0px 0px 15px inset;">

        <!-- Cabeçalho do Card / Branding -->
        <div class="text-center mb-4">
            <div class="brand-logo-icon">
                <i class="bi bi-printer-fill"></i>
            </div>
            <h1 class="h3 fw-bold mb-1">Gráfica EPA</h1>
            <p class="text-secondary small mb-0">Solicitação de Cadastro Industrial</p>
        </div>

        <!-- Bloco de Alerta Nativo Flask/Jinja2 (Substituiu a div controlada por JS) -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category if category != 'error' else 'danger' }} d-flex align-items-center mb-3" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2 flex-shrink-0"></i>
                        <div class="small">{{ message }}</div>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Formulário de Cadastro Tradicional apontando para a sua rota /usuarios -->
        <form action="/usuarios" method="POST">

            <!-- Campo Nome Completo (Adicionado para dar suporte ao campo 'nome' esperado pela API) -->
            <div class="mb-3">
                <label class="form-label text-light small fw-semibold" for="nome">
                    <i class="bi bi-person me-1 text-primary"></i> Nome Completo
                </label>
                <input autocomplete="name" class="form-control form-control-lg bg-dark text-light border-secondary" id="nome" name="nome" placeholder="Digite seu nome completo" required type="text"/>
            </div>

            <!-- Campo de CPF -->
            <div class="mb-3">
                <label class="form-label text-light small fw-semibold" for="cpf">
                    <i class="bi bi-person-vcard me-1 text-primary"></i> CPF
                </label>
                <!-- Removido máscara JS, o operador digita apenas números -->
                <input autocomplete="off" class="form-control form-control-lg bg-dark text-light border-secondary" id="cpf" inputmode="numeric" maxlength="11" name="cpf" placeholder="Digite apenas os 11 números" required type="text"/>
            </div>

            <!-- Campo de E-mail -->
            <div class="mb-3">
                <label class="form-label text-light small fw-semibold" for="email">
                    <i class="bi bi-envelope me-1 text-primary"></i> E-mail Corporativo
                </label>
                <input autocomplete="email" class="form-control form-control-lg bg-dark text-light border-secondary" id="email" name="email" placeholder="operador@graficaepa.com.br" required type="email"/>
            </div>

            <!-- Campo de Senha -->
            <div class="mb-3">
                <label class="form-label text-light small fw-semibold mb-0" for="senha">
                    <i class="bi bi-shield-lock me-1 text-primary"></i> Senha de Acesso
                </label>
                <input autocomplete="new-password" class="form-control form-control-lg bg-dark text-light border-secondary" id="senha" name="senha" placeholder="••••••••" required type="password"/>
            </div>

            <!-- Campo de Confirmar Senha -->
            <div class="mb-3">
                <label class="form-label text-light small fw-semibold mb-0" for="confirmarSenha">
                    <i class="bi bi-shield-check me-1 text-primary"></i> Confirmar Senha
                </label>
                <input autocomplete="new-password" class="form-control form-control-lg bg-dark text-light border-secondary" id="confirmarSenha" name="confirmarSenha" placeholder="••••••••" required type="password"/>
            </div>

            <!-- Botão de Envio Padrão -->
            <button class="btn btn-primary btn-lg w-100 fw-semibold d-flex justify-content-center align-items-center gap-2 mt-4" type="submit">
                <span>Criar Conta no Sistema</span>
            </button>
        </form>

        <!-- Rodapé do Card -->
        <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
            <p class="text-secondary small mb-0">
                Já possui uma conta ativa?
                <a class="text-primary fw-semibold text-decoration-none" href="/login">Fazer login</a>
            </p>
        </div>
    </div>
</main>

<!-- Bootstrap 5.3 JS Bundle CDN -->
<script crossorigin="anonymous" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" src="https://jsdelivr.net"></script>
</body>
</html>

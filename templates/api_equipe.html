<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar equipe | Gráfica EPA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="topo">
        <div class="topo-conteudo">
            <div>
                <p class="marca">Gráfica EPA</p>
                <p class="submarca">Cadastro de equipes</p>
            </div>

            <nav class="navegacao">
                <a href="{{ url_for('montar_equipe') }}">Ver equipes</a>
            </nav>
        </div>
    </header>

    <main class="pagina">
        <section class="cartao cartao-pequeno">
            <h1>Cadastrar equipe</h1>

            <p class="texto-ajuda">
                Informe o nome da equipe e o CPF do funcionário responsável.
            </p>

            {% with mensagens = get_flashed_messages(with_categories=true) %}
                {% for categoria, mensagem in mensagens %}
                    <div class="mensagem mensagem-{{ categoria }}">
                        {{ mensagem }}
                    </div>
                {% endfor %}
            {% endwith %}

            <form class="formulario" method="POST"
                  action="{{ url_for('cadastrar_equipe') }}">

                <div class="campo">
                    <label for="nome_da_equipe">Nome da equipe</label>
                    <input
                        type="text"
                        id="nome_da_equipe"
                        name="nome_da_equipe"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="cpf_informados">CPF do responsável</label>
                    <input
                        type="text"
                        id="cpf_informados"
                        name="cpf_informados"
                        placeholder="000.000.000-00"
                        maxlength="14"
                        inputmode="numeric"
                        required
                    >
                </div>

                <button class="botao" type="submit">
                    Salvar equipe
                </button>

                <a class="botao botao-secundario"
                   href="{{ url_for('montar_equipe') }}">
                    Cancelar
                </a>
            </form>
        </section>
    </main>

    <script>
        const campoCPF = document.getElementById('cpf_informados');

        campoCPF.addEventListener('input', function () {
            let cpf = this.value.replace(/\D/g, '').slice(0, 11);

            cpf = cpf.replace(/(\d{3})(\d)/, '$1.$2');
            cpf = cpf.replace(/(\d{3})(\d)/, '$1.$2');
            cpf = cpf.replace(/(\d{3})(\d{1,2})$/, '$1-$2');

            this.value = cpf;
        });
    </script>
</body>
</html>
